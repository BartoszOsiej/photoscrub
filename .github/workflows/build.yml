name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  NUITKA: >-
    python -m nuitka --onefile --assume-yes-for-downloads
    --include-package=PIL --include-package=cryptography
    --include-package=tkinterdnd2 --enable-plugin=tk-inter

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and smoke test
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka
          python photoscrub.py --help > /dev/null
          python -c "import model, license, ruleset; print('modules ok')"
      - name: Build CLI with Nuitka
        run: |
          set -e
          python -m nuitka --onefile --assume-yes-for-downloads \
            --include-package=PIL --include-package=cryptography \
            --output-filename=photoscrub --output-dir=build photoscrub.py
          ls -la build/ || true
      - name: Normalise name and test the binary
        run: |
          set -e
          rm -rf staging && mkdir staging
          bin="$(find build -maxdepth 1 -type f -name 'photoscrub*' ! -name '*.build' ! -name '*.dist' ! -name '*.onefile' | head -1)"
          echo "binary: $bin"
          test -n "$bin"
          cp "$bin" staging/photoscrub
          chmod +x staging/photoscrub
          ./staging/photoscrub --help > /dev/null
          echo "linux binary runs"
          cd staging && sha256sum photoscrub > photoscrub-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: photoscrub-linux
          path: staging/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and smoke test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka
          python photoscrub.py --help
          python -c "import model, license, ruleset; print('modules ok')"
      - name: Build CLI with Nuitka
        run: |
          python -m nuitka --onefile --assume-yes-for-downloads --include-package=PIL --include-package=cryptography --output-filename=photoscrub.exe --output-dir=build photoscrub.py
          Get-ChildItem build || exit 0
      - name: Normalise name and test the exe
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path build -Filter 'photoscrub*' -File |
                 Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          if (-not $bin) { throw "exe not produced" }
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item $bin.FullName staging/photoscrub.exe
          & .\staging\photoscrub.exe --help
          if ($LASTEXITCODE -ne 0) { throw "built exe does not run" }
          "windows exe runs"
          (Get-FileHash staging/photoscrub.exe -Algorithm SHA256).Hash.ToLower() + "  photoscrub.exe" |
            Out-File -Encoding ascii staging/photoscrub-windows.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: photoscrub-windows
          path: staging/

  gui:
    name: gui (qt, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: photoscrub-gui.exe
          - os: ubuntu-latest
            out: photoscrub-gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb
          fi
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka pyinstaller
      - name: Smoke test the Qt UI (offscreen)
        run: |
          QT_QPA_PLATFORM=offscreen python -c "
          import sys
          sys.argv=['photoscrub']
          from PySide6 import QtWidgets
          app=QtWidgets.QApplication([])
          import qt_gui
          w=qt_gui.Window()
          print('ok window:', w.windowTitle(), w.size().width(), 'x', w.size().height())
          "
      - name: Build with Nuitka (preferred - no .pyc to unpack)
        continue-on-error: true
        shell: bash
        run: |
          # --include-package=PySide6 pakowal 648 MB (WebEngine, Qt3D,
          # QtMultimedia...) na 14 MB faktycznie uzywanych modulow
          # (QtCore/QtGui/QtWidgets). Build wazyl 732 MB, a kod to 5 tys.
          # linii. Zostawiamy modul po module, reszta jest balastem.
          python -m nuitka --onefile --assume-yes-for-downloads \
            --enable-plugin=pyside6 \
            --include-package=PySide6.QtCore \
            --include-package=PySide6.QtGui \
            --include-package=PySide6.QtWidgets \
            --include-module=shiboken6 \
            --include-package=PIL --include-package=cryptography \
            --include-module=qrcode --include-module=pillow_heif \
            --nofollow-import-to=PySide6.QtWebEngineCore \
            --nofollow-import-to=PySide6.QtWebEngineWidgets \
            --nofollow-import-to=PySide6.Qt3DCore \
            --nofollow-import-to=PySide6.Qt3DRender \
            --nofollow-import-to=PySide6.Qt3DExtras \
            --nofollow-import-to=PySide6.QtMultimedia \
            --nofollow-import-to=PySide6.QtMultimediaWidgets \
            --nofollow-import-to=PySide6.QtQuick3D \
            --nofollow-import-to=PySide6.QtCharts \
            --nofollow-import-to=PySide6.QtDataVisualization \
            --nofollow-import-to=PySide6.QtBluetooth \
            --nofollow-import-to=PySide6.QtPositioning \
            --nofollow-import-to=PySide6.QtSerialPort \
            --nofollow-import-to=tkinter --nofollow-import-to=unittest \
            --output-dir=build --output-filename=${{ matrix.out }} qt_gui.py
      - name: Fallback to PyInstaller if Nuitka failed
        if: failure()
        shell: bash
        run: |
          echo "Nuitka failed - shipping PyInstaller build instead"
          # --collect-all PySide6 to ten sam blad co --include-package:
          # pakuje 648 MB, z czego uzywamy 14 MB. --collect-all zostaje
          # tylko dla PIL (hooking HEIF), a PySide6 idzie modulami.
          if [ "$RUNNER_OS" = "Windows" ]; then
            pyinstaller --onefile --noconsole --name photoscrub-gui \
              --collect-all PIL \
              --hidden-import=PySide6.QtCore \
              --hidden-import=PySide6.QtGui \
              --hidden-import=PySide6.QtWidgets \
              --hidden-import=qrcode --hidden-import=pillow_heif \
              --exclude-module=PySide6.QtWebEngineCore \
              --exclude-module=PySide6.QtWebEngineWidgets \
              --exclude-module=PySide6.Qt3DCore \
              --exclude-module=PySide6.Qt3DRender \
              --exclude-module=PySide6.Qt3DExtras \
              --exclude-module=PySide6.QtMultimedia \
              --exclude-module=PySide6.QtMultimediaWidgets \
              --exclude-module=PySide6.QtQuick3D \
              --exclude-module=PySide6.QtCharts \
              --exclude-module=PySide6.QtDataVisualization \
              --exclude-module=PySide6.QtBluetooth \
              --exclude-module=PySide6.QtPositioning \
              --exclude-module=PySide6.QtSerialPort \
              --exclude-module=tkinter --exclude-module=unittest \
              qt_gui.py
          else
            pyinstaller --onefile --name photoscrub-gui \
              --collect-all PIL \
              --hidden-import=PySide6.QtCore \
              --hidden-import=PySide6.QtGui \
              --hidden-import=PySide6.QtWidgets \
              --hidden-import=qrcode --hidden-import=pillow_heif \
              --exclude-module=PySide6.QtWebEngineCore \
              --exclude-module=PySide6.QtWebEngineWidgets \
              --exclude-module=PySide6.Qt3DCore \
              --exclude-module=PySide6.Qt3DRender \
              --exclude-module=PySide6.Qt3DExtras \
              --exclude-module=PySide6.QtMultimedia \
              --exclude-module=PySide6.QtMultimediaWidgets \
              --exclude-module=PySide6.QtQuick3D \
              --exclude-module=PySide6.QtCharts \
              --exclude-module=PySide6.QtDataVisualization \
              --exclude-module=PySide6.QtBluetooth \
              --exclude-module=PySide6.QtPositioning \
              --exclude-module=PySide6.QtSerialPort \
              --exclude-module=tkinter --exclude-module=unittest \
              qt_gui.py
          fi
      - name: Report binary size
        shell: bash
        run: |
          f=$(find . -name "${{ matrix.out }}" -type f -not -path './build/*' \
              -not -path './dist/*' | head -1)
          [ -z "$f" ] && f=$(find . -name "${{ matrix.out }}" -type f | head -1)
          if [ -n "$f" ]; then
            mb=$(du -m "$f" | cut -f1)
            echo "ROZMIAR ${{ matrix.out }}: ${mb} MB"
            echo "### rozmiar ${{ matrix.out }}: ${mb} MB" >> $GITHUB_STEP_SUMMARY
            if [ "$mb" -gt 120 ]; then
              echo "::warning::binary ${mb} MB - sprawdz --include-package"
            fi
          else
            echo "::error::nie znaleziono ${{ matrix.out }}"
          fi
      - name: Stage the binary
        shell: pwsh
        run: |
          $want = "${{ matrix.out }}"
          $bin = Get-ChildItem -Path . -Recurse -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -eq $want } | Select-Object -First 1
          if (-not $bin) {
            $bin = Get-ChildItem -Path dist,build -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.Name -match 'qt_gui|photoscrub-gui' } | Select-Object -First 1
          }
          if (-not $bin) { throw "GUI binary not produced" }
          New-Item -ItemType Directory -Force "staging-${{ matrix.os }}" | Out-Null
          Copy-Item $bin.FullName "staging-${{ matrix.os }}/$want"
          Get-Item "staging-${{ matrix.os }}/$want" | Select-Object Name,Length
      - name: Verify the GUI binary starts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            chmod +x "staging-${{ matrix.os }}/photoscrub-gui"
            QT_QPA_PLATFORM=offscreen timeout 30 "staging-${{ matrix.os }}/photoscrub-gui" --version ||               QT_QPA_PLATFORM=offscreen timeout 20 "staging-${{ matrix.os }}/photoscrub-gui" --help || true
          else
            echo "windows GUI built (cannot execute here, verified in CI job instead)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: photoscrub-gui-${{ runner.os }}
          path: staging-${{ matrix.os }}/

  msix:
    runs-on: windows-latest
    needs: [windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exe
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka
          python -m nuitka --onefile --assume-yes-for-downloads --include-package=PIL --include-package=cryptography --output-filename=photoscrub.exe --output-dir=build photoscrub.py
      - name: Pack MSIX
        shell: pwsh
        run: |
          $kfh = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $kfh) {
            $kfh = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          }
          if (-not $kfh) { throw "makeappx.exe not found" }
          New-Item -ItemType Directory -Force msix_payload | Out-Null
          # Nuitka bez --output-dir pisze do biezacego katalogu, wiec plik
          # lezy w repo, nie w build/ (i build/ w ogole nie istnieje).
          $exe = Get-ChildItem -Path . -Recurse -File -Filter 'photoscrub.exe' -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -notmatch 'msix_payload|dist' } | Select-Object -First 1
          if (-not $exe) { throw "photoscrub.exe not produced" }
          Get-Item $exe.FullName | Select-Object FullName,Length
          Copy-Item $exe.FullName msix_payload/photoscrub.exe
          Copy-Item packaging/msix/AppxManifest.xml msix_payload/
          Copy-Item -Recurse packaging/msix/assets msix_payload/assets
          New-Item -ItemType Directory -Force msix_out | Out-Null
          & $kfh.FullName pack /d msix_payload /p msix_out/photoscrub.msix /o
          if (-not (Test-Path msix_out/photoscrub.msix)) { throw "MSIX not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: photoscrub-msix
          path: msix_out/

  release:
    needs: [linux, windows, gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/photoscrub-linux/photoscrub
            artifacts/photoscrub-linux/photoscrub-linux.sha256
            artifacts/photoscrub-windows/photoscrub.exe
            artifacts/photoscrub-windows/photoscrub-windows.sha256
            artifacts/photoscrub-gui-Windows/photoscrub-gui.exe
            artifacts/photoscrub-gui-Linux/photoscrub-gui
            artifacts/photoscrub-msix/msix_out/photoscrub.msix
          body: |
            Find out what your photos leak, then strip it. Local, offline, no account.

            **GUI**
            - Windows: `photoscrub-gui.exe`
            - Linux: `chmod +x photoscrub-gui && ./photoscrub-gui`

            **CLI**
            - Windows: `photoscrub.exe`
            - Linux: `chmod +x photoscrub && ./photoscrub PATH`

            **MSIX** (for MS Store packaging): `photoscrub.msix`

            Verify (Linux):
            ```
            sha256sum -c photoscrub-linux.sha256
            ```

            A license key is needed to remove anything. Ask and you get one.
            Ruleset v1 covers EXIF, GPS, device serial and the thumbnail hidden inside
            the JPEG. Ruleset v2 adds HEIC, XMP, IPTC, PNG chunks, data appended after
            the image, GPS in video, and addresses in free text.