name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka
      - name: Smoke test the engine
        run: |
          python - <<'PY'
          import subprocess, sys, os
          # engine musi dzialac na Linuksie, inaczej nie wydajemy nic
          r = subprocess.run([sys.executable, 'photoscrub.py', '--help'],
                             capture_output=True, text=True)
          assert r.returncode == 0, r.stderr
          print('engine ok')
          PY
      - name: Build onefile binary (Nuitka - brak .pyc do rozpakowania)
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=photoscrub \
            --include-package=PIL \
            --include-package=cryptography \
            photoscrub.py
      - name: Test the binary
        run: |
          chmod +x dist/photoscrub
          ./dist/photoscrub --help
          ./dist/photoscrub /tmp || true
      - name: Checksum + package
        run: |
          cd dist
          sha256sum photoscrub > photoscrub-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: photoscrub-linux
          path: dist/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka
      - name: Smoke test the engine
        shell: pwsh
        run: |
          python photoscrub.py --help
          if ($LASTEXITCODE -ne 0) { throw "engine failed on Windows" }
          "engine ok on windows"
      - name: Build exe (Nuitka - brak .pyc do rozpakowania)
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=photoscrub.exe \
            --include-package=PIL \
            --include-package=PIL.Image \
            --include-package=cryptography \
            photoscrub.py
      - name: Test the exe
        shell: pwsh
        run: |
          .\dist\photoscrub.exe --help
          if ($LASTEXITCODE -ne 0) { throw "built exe does not run" }
          "exe runs on windows"
      - name: Checksum
        run: |
          cd dist
          (Get-FileHash photoscrub.exe -Algorithm SHA256).Hash.ToLower() + "  photoscrub.exe" | Out-File -Encoding ascii photoscrub-windows.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: photoscrub-windows
          path: dist/

  gui:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: dist/photoscrub-gui.exe
            cmd: powershell
          - os: ubuntu-latest
            out: dist/photoscrub-gui
            cmd: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (Linux needs tk)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y python3-tk; fi
      - name: Build GUI with Nuitka
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=photoscrub-gui \
            --include-package=PIL \
            --include-package=cryptography \
            --include-package=tkinterdnd2 \
            --enable-plugin=tk-inter \
            gui.py
      - name: Move binary to expected name
        shell: pwsh
        run: |
          if ("${{ runner.os }}" -eq "Windows") { Move-Item -Force dist/gui.exe dist/photoscrub-gui.exe }
          else { Move-Item -Force dist/gui.bin dist/photoscrub-gui 2>$null; Move-Item -Force dist/gui dist/photoscrub-gui 2>$null }
      - uses: actions/upload-artifact@v4
        with:
          name: photoscrub-gui-${{ runner.os }}
          path: dist/

  msix:
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka
      - name: Build exe (Nuitka - brak .pyc do rozpakowania)
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-filename=photoscrub.exe \
            --include-package=PIL \
            --include-package=PIL.Image \
            --include-package=cryptography \
            photoscrub.py
      - name: Pack MSIX (unsigned layout)
        shell: pwsh
        run: |
          # makeappx nie jest w PATH na runnerze. Szukamy SDK w dwóch typowych miejscach.
          $kfh = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $kfh) {
            $kfh = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter makeappx.exe -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          }
          if (-not $kfh) { throw "makeappx.exe not found - Windows SDK missing on this runner image" }
          "using: $($kfh.FullName)"
          New-Item -ItemType Directory -Force msix_payload | Out-Null
          Copy-Item dist/photoscrub.exe msix_payload/
          Copy-Item packaging/msix/AppxManifest.xml msix_payload/
          Copy-Item -Recurse packaging/msix/assets msix_payload/assets
          New-Item -ItemType Directory -Force msix_out | Out-Null
          & $kfh.FullName pack /d msix_payload /p msix_out/photoscrub.msix /o
          if (-not (Test-Path msix_out/photoscrub.msix)) { throw "MSIX not produced" }
          Get-Item msix_out/photoscrub.msix | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: photoscrub-msix
          path: msix_out/

  release:
    needs: [linux, windows, gui]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/photoscrub-msix/msix_out/photoscrub.msix
            artifacts/photoscrub-linux/photoscrub
            artifacts/photoscrub-linux/photoscrub-linux.sha256
            artifacts/photoscrub-windows/photoscrub.exe
            artifacts/photoscrub-windows/photoscrub-windows.sha256
            artifacts/photoscrub-gui-Windows/dist/photoscrub-gui.exe
            artifacts/photoscrub-gui-Linux/dist/photoscrub-gui
          body: |
            Metadata leak scanner and remover. Local, offline, no account.

            GUI  Windows: `photoscrub-gui.exe`
            GUI  Linux:   `chmod +x photoscrub-gui && ./photoscrub-gui`
            CLI  Windows: `photoscrub.exe`
            CLI  Linux:   `chmod +x photoscrub && ./photoscrub PATH`

            Need a license key? Ask, and you get one. Ruleset v1 covers EXIF, GPS,
            serial and the thumbnail hidden inside the JPEG. Ruleset v2 adds HEIC,
            XMP, IPTC, PNG chunks, data appended after the image, GPS in video, and
            addresses in free text.

            Verify:
            ```
            sha256sum -c photoscrub-linux.sha256
            ```